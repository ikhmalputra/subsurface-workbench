name: CI
# Pull requests already cover branch work; triggering on push as well ran the whole matrix twice
# for every commit. Push now only covers the default branch.
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read

# Superseded runs are cancelled, so pushing twice in a row no longer leaves a full matrix running
# against a commit nobody is waiting on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The same runner a release is gated by locally: tools/ci/run.mjs, tier t0 on every commit.
      - run: node tools/ci/run.mjs --tier t0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-report
          path: output/reports/

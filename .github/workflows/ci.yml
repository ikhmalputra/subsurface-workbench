name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Core and asset tests import source directly and lint reads source, so they run before the
      # build for fast feedback. test:demo-library imports the packages through their export maps,
      # which resolve into dist, so it has to wait for the build.
      - run: pnpm test && pnpm test:asset && pnpm lint
      - run: pnpm audit --audit-level high
      - run: pnpm build
      - run: pnpm test:demo-library
      - run: pnpm test:render-adapters
      - run: pnpm test:packages
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm exec playwright test e2e/rendering.spec.ts --grep "native WebGPU"
        env:
          WEBGPU_TEST: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: output/
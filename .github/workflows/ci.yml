name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Core and asset tests import source directly and lint reads source, so they run before the
      # build for fast feedback. test:demo-library imports the packages through their export maps,
      # which resolve into dist, so it has to wait for the build.
      - run: pnpm test && pnpm test:asset && pnpm lint
      - run: pnpm audit --audit-level high
      - run: pnpm build
      - run: pnpm test:demo-library
      - run: pnpm test:render-adapters
      - run: pnpm test:packages

  # Browser tests run on software WebGL here, which is several times slower than a real GPU. As one
  # serial job the suite reached 42 minutes; sharding keeps wall time reasonable and gives each
  # shard a whole runner rather than competing for one.
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: output/

  # Requires a working adapter and asserts rendered-pixel changes, so it stays its own job rather
  # than sharing a shard's budget.
  webgpu:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/rendering.spec.ts --grep "native WebGPU"
        env:
          WEBGPU_TEST: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgpu-evidence
          path: |
            output/
            test-results/
